name: Sync forks with upstream

on:
  schedule:
    # Every Monday at 05:57 UTC (06:57 CET / 07:57 CEST)
    - cron: "57 5 * * 1"
    # Every Thursday at 17:57 UTC (18:57 CET / 19:57 CEST)
    - cron: "57 17 * * 4"
  workflow_dispatch:

permissions: {}

jobs:
  sync:
    name: ${{ matrix.fork }} (${{ matrix.branch }})
    runs-on: ubuntu-latest
    permissions:
      # Needed to set the per-fork commit status on this repository.
      statuses: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - fork: christoph-jerolimov/backstage
            upstream: backstage/backstage
            branch: master
          - fork: christoph-jerolimov/backstage-community-plugins
            upstream: backstage/community-plugins
            branch: main
          - fork: christoph-jerolimov/rhdh
            upstream: redhat-developer/rhdh
            branch: main
          - fork: christoph-jerolimov/rhdh-plugins
            upstream: redhat-developer/rhdh-plugins
            branch: main
          - fork: christoph-jerolimov/rhdh-skills
            upstream: redhat-developer/rhdh-skills
            branch: main
          - fork: christoph-jerolimov/rhdh-plugin-export-overlays
            upstream: redhat-developer/rhdh-plugin-export-overlays
            branch: main
          - fork: christoph-jerolimov/rhdh-loadtest
            upstream: redhat-developer/rhdh-loadtest
            branch: main
          - fork: christoph-jerolimov/rhdh-local
            upstream: redhat-developer/rhdh-local
            branch: main
          - fork: christoph-jerolimov/rhdh-e2e-test-utils
            upstream: redhat-developer/rhdh-e2e-test-utils
            branch: main
          - fork: christoph-jerolimov/roadie-backstage-plugins
            upstream: RoadieHQ/roadie-backstage-plugins
            branch: main
          - fork: christoph-jerolimov/immobiliare-gitlab-plugin
            upstream: immobiliare/backstage-plugin-gitlab
            branch: main
    env:
      FORK: ${{ matrix.fork }}
      UPSTREAM: ${{ matrix.upstream }}
      BRANCH: ${{ matrix.branch }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - name: Set pending commit status
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/${{ github.repository }}/statuses/${{ github.sha }}" \
            -f state=pending \
            -f context="fork-sync/${FORK##*/}" \
            -f description="Syncing ${BRANCH} from ${UPSTREAM}…" \
            -f target_url="${RUN_URL}" > /dev/null

      - name: Sync ${{ matrix.branch }} from ${{ matrix.upstream }}
        id: sync
        env:
          # Fine-grained PAT with "Contents: Read and write" on the forks above.
          # The default GITHUB_TOKEN can only write to this repository.
          GH_TOKEN: ${{ secrets.FORK_SYNC_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${GH_TOKEN}" ]; then
            echo "::error::Secret FORK_SYNC_TOKEN is not set."
            exit 1
          fi

          before=$(gh api "repos/${FORK}/branches/${BRANCH}" --jq .commit.sha)
          echo "Fork ${FORK}@${BRANCH} is at ${before}"

          # Same as the "Sync fork" button on GitHub: fast-forwards the branch
          # from the upstream repository. Fails (without --force) if the fork
          # has diverged, so no history is ever overwritten.
          gh repo sync "${FORK}" --source "${UPSTREAM}" --branch "${BRANCH}"

          after=$(gh api "repos/${FORK}/branches/${BRANCH}" --jq .commit.sha)
          if [ "${before}" = "${after}" ]; then
            result="Already up to date (${after:0:7})"
            echo "- **${FORK}** \`${BRANCH}\`: already up to date (\`${after:0:7}\`)" >> "$GITHUB_STEP_SUMMARY"
          else
            result="Updated ${before:0:7} → ${after:0:7}"
            echo "- **${FORK}** \`${BRANCH}\`: \`${before:0:7}\` → \`${after:0:7}\`" >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "${result}"
          echo "result=${result}" >> "$GITHUB_OUTPUT"

      - name: Set final commit status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          OUTCOME: ${{ steps.sync.outcome }}
          RESULT: ${{ steps.sync.outputs.result }}
        run: |
          case "${OUTCOME}" in
            success)   state=success; description="${RESULT:-Synced ${BRANCH} from ${UPSTREAM}}" ;;
            cancelled) state=error;   description="Sync of ${BRANCH} from ${UPSTREAM} was cancelled" ;;
            *)         state=failure; description="Sync of ${BRANCH} from ${UPSTREAM} failed" ;;
          esac
          gh api "repos/${{ github.repository }}/statuses/${{ github.sha }}" \
            -f state="${state}" \
            -f context="fork-sync/${FORK##*/}" \
            -f description="${description}" \
            -f target_url="${RUN_URL}" > /dev/null
